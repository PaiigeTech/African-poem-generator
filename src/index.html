    <title>African-Poem-Generator</title>

<body>
    <header>
    <h1>Welcome to Africa's Big 5!</h1>
</header>
 <main>
      <form>
        <input
          type="text"
          placeholder="Enter the topic of the French poem"

          required
          autocomplete="off"

      <div>
        La tombe dit à la rose
        <br />
        Des pleurs dont l'aube t'arrose
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</body>
